<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
    <!-- <link href="style.css" rel="stylesheet"> -->
</head>
<body>
    <a href="network.html">network settings</a>
    <a href="points.html">points</a>
    <pre id="status"></pre>
    <pre id="points"></pre>
    <canvas width="500" height="500"></canvas>
    <!-- <script src="index.js"></script> -->
    <script>
        let screenPoints;
        let targetPoinitIndex;

        const canvas = document.querySelector("canvas")  
        const ctx = canvas.getContext("2d")  

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const maxRadius = Math.min(cx, cy) - 40; 

        let gateway = `ws://${window.location.hostname}/ws`;
        
        let websocket;

        function initWebSocket() {
            console.log('Trying to open a WebSocket connection...');
            websocket = new WebSocket(gateway);
            
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
            websocket.onmessage = onMessage;
            websocket.onerror = onError;
        }

        function onOpen(event) {
            console.log('Connection opened');
        }

        function onClose(event) {
            console.log('Connection closed');
            setTimeout(initWebSocket, 2000);
        }

        function onError(event) {
            console.error('WebSocket error observed:', event);
        }

        function onMessage(event) {
            try {
                const data = JSON.parse(event.data);
                console.log('Data received via WebSocket:', data);

                if (data.targetPoinitIndex !== undefined) {
                    targetPoinitIndex = data.targetPoinitIndex;
                    repaint();
                }
                if (data.temp !== undefined) {
                    document.getElementById('temp').innerText = data.temp;
                }
            } catch (err) {
                console.error('Failed to parse WebSocket JSON:', err);
            }
        }

        window.addEventListener('load', initWebSocket);

        function repaint() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, maxRadius, 0, 2 * Math.PI);
            ctx.moveTo(cx - maxRadius, cy); ctx.lineTo(cx + maxRadius, cy);
            ctx.moveTo(cx, cy - maxRadius); ctx.lineTo(cx, cy + maxRadius);
            ctx.stroke();

            if (!screenPoints)
                return

            ctx.strokeStyle = '#2196f3'; 
            ctx.lineWidth = 2;           
          
            
            if (screenPoints.length > 0) {
                ctx.beginPath();
                ctx.moveTo(screenPoints[0].x, screenPoints[0].y);
                for (let i = 1; i < screenPoints.length; i++) {
                    ctx.lineTo(screenPoints[i].x, screenPoints[i].y);
                    if (targetPoinitIndex && i === targetPoinitIndex) {
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.lineWidth = 1;  
                        ctx.strokeStyle = '#ff1961';
                        ctx.moveTo(screenPoints[i].x, screenPoints[i].y);
                    }
                }
                ctx.stroke();
            }

            // ctx.fillStyle = '#ff5722'; 
            // screenPoints.forEach(pt => {
            //     ctx.beginPath();
            //     ctx.arc(pt.x, pt.y, 1.5, 0, 2 * Math.PI); 
            //     ctx.fill();
            // });
        }

        fetch('/points', {method: "POST"})
        .then(res => {
            if (!res.ok) 
                throw new Error('error fetching points');
            return res.arrayBuffer(); 
        })
        .then(buffer => {
            const rawPoints = new Float32Array(buffer); 
            if (rawPoints.length === 0) 
                return;
            screenPoints = []
            for (let i = 0; i < rawPoints.length; i += 2) {
                const a = rawPoints[i];     // Угол
                const r = rawPoints[i + 1]; // Радиус
                const drawX = cx + (r * maxRadius) * Math.cos(a);
                const drawY = cy + (r * maxRadius) * Math.sin(a);
                screenPoints.push({ x: drawX, y: drawY });
            }
            repaint();
        });


        
    </script>
</body>
</html>
