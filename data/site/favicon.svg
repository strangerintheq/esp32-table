<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      /* Light mode styles (default) */
      .bg { fill: none; }
      .grid-ring { fill: none; stroke: #94a3b8; stroke-width: 1; opacity: 0.4; }
      .grid-line { stroke: #94a3b8; stroke-width: 0.75; stroke-dasharray: 1 1; opacity: 0.4; }
      .plot-path { fill: none; stroke: #2563eb; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .plot-point { fill: #ef4444; stroke: #ffffff; stroke-width: 1; }
      
      /* Dynamic Dark Mode adjustments */
      @media (prefers-color-scheme: dark) {
        .grid-ring { stroke: #64748b; opacity: 0.6; }
        .grid-line { stroke: #64748b; opacity: 0.6; }
        .plot-path { stroke: #3b82f6; }
        .plot-point { fill: #f87171; stroke: #0f172a; }
      }
    </style>
  </defs>

  <!-- Optional Background Tipping for high-contrast visibility -->
  <rect class="bg" width="32" height="32" rx="6" />

  <!-- Polar Grid System -->
  <circle class="grid-ring" cx="16" cy="16" r="14" />
  <circle class="grid-ring" cx="16" cy="16" r="9" />
  <circle class="grid-ring" cx="16" cy="16" r="4" />
  
  <!-- Angular Axis Lines -->
  <line class="grid-line" x1="2" y1="16" x2="30" y2="16" />
  <line class="grid-line" x1="16" y1="2" x2="16" y2="30" />
  <line class="grid-line" x1="6.1" y1="6.1" x2="25.9" y2="25.9" />
  <line class="grid-line" x1="6.1" y1="25.9" x2="25.9" y2="6.1" />

  <!-- The Polar Plot Spiral/Path -->
  <path class="plot-path" d="M 16 16 C 17 13, 21 11, 23 13 C 25 15, 23 21, 19 23 C 14 25, 6 20, 8 13 C 9.5 8, 17 4, 25 7" />

  <!-- Active Plotter Head Position -->
  <circle class="plot-point" cx="25" cy="7" r="2.2" />
</svg>
