<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки сети</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #eceff1; padding: 20px; display: flex; justify-content: center; }
    .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 360px; }
    h2 { margin: 0 0 25px; color: #263238; font-size: 22px; text-align: center; }

    /* Стили для тумблера-переключателя */
    .switch-group { margin-bottom: 25px; }
    .switch-container { display: flex; align-items: center; justify-content: space-between; background: #f5f7f8; padding: 12px; border-radius: 8px; border: 1px solid #cfd8dc; }
    .switch-label { font-weight: bold; color: #455a64; font-size: 14px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196f3; }
    input:checked + .slider:before { transform: translateX(24px); }
    .mode-text { font-size: 14px; font-weight: bold; color: #2196f3; min-width: 80px; text-align: right; }

    /* Эффект анимации Floating Labels (Всплывающих подписей) */
    .floating-group { position: relative; margin-bottom: 20px; transition: all 0.3s ease; }

    .floating-group input {
      width: 100%;
      padding: 16px 12px 6px 12px; /* Увеличили верхний отступ для сдвинутого текста */
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .floating-group input:focus { border-color: #2196f3; }

    /* Исходное состояние подписи (имитирует обычный плейсхолдер внутри поля) */
    .floating-group label {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #90a4ae;
      font-size: 15px;
      pointer-events: none; /* Чтобы клик проходил сквозь текст на input */
      transition: all 0.2s ease;
      background: transparent;
    }

    /* Состояние подписи, когда поле в фокусе ИЛИ когда оно не пустое (placeholder-shown) */
    .floating-group input:focus ~ label,
    .floating-group input:not(:placeholder-shown) ~ label {
      top: 3px;
      font-size: 11px;
      font-weight: bold;
      color: #2196f3;
      transform: translateY(0);
    }

    /* Изменение цвета подписи, если поле не в фокусе, но заполнено данными */
    .floating-group input:not(:placeholder-shown):not(:focus) ~ label {
      color: #78909c;
    }

    .hidden { display: none; }
    button { width: 100%; padding: 12px; background: #2196f3; border: none; color: white; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    button:hover { background: #1e88e5; }
    .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-size: 14px; background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
<div class="box">
  <h2>Настройка сети</h2>
  <form id="wifiForm">
    <div class="switch-group">
      <div class="switch-container">
        <span class="switch-label">Режим работы</span>
        <label class="switch">
          <input type="checkbox" id="modeToggle">
          <span class="slider"></span>
        </label>
        <span id="modeText" class="mode-text">Wi-Fi (STA)</span>
      </div>
    </div>

    <!-- Блок полей для подключения к роутеру (STA) -->
    <div id="staFields">
      <div class="floating-group">
        <!-- placeholder=" " обязателен для корректной работы CSS селектора :placeholder-shown -->
        <input type="text" id="wifi_ssid" placeholder=" ">
        <label>Wi-Fi SSID (Роутер)</label>
      </div>
      <div class="floating-group">
        <input type="password" id="wifi_pass" placeholder=" ">
        <label>Wi-Fi Пароль</label>
      </div>
    </div>

    <!-- Блок полей для собственной точки доступа (AP) -->
    <div id="apFields" class="hidden">
      <div class="floating-group">
        <input type="text" id="ap_ssid" placeholder=" ">
        <label>Имя точки ESP32 (AP SSID)</label>
      </div>
      <div class="floating-group">
        <input type="password" id="ap_pass" placeholder=" ">
        <label>Пароль точки ESP32 (AP Pass)</label>
      </div>
    </div>

    <button type="submit">Сохранить и применить</button>
  </form>
  <div id="statusBox" class="status">Настройки сохранены!<br>ESP32 перезагружается...</div>
</div>

<script>
  const toggle = document.getElementById('modeToggle');
  const modeText = document.getElementById('modeText');
  const staFields = document.getElementById('staFields');
  const apFields = document.getElementById('apFields');

  function updateFieldsVisibility() {
    const isAP = toggle.checked;
    modeText.textContent = isAP ? 'Точка (AP)' : 'Wi-Fi (STA)';

    if (isAP) {
      staFields.classList.add('hidden');
      apFields.classList.remove('hidden');
    } else {
      staFields.classList.remove('hidden');
      apFields.classList.add('hidden');
    }
  }

  toggle.addEventListener('change', updateFieldsVisibility);

  window.addEventListener('DOMContentLoaded', () => {
    fetch('/network/get', {method: "POST"})
            .then(res => res.json())
            .then(data => {
              toggle.checked = data.network_mode !== 'wifi';
              document.getElementById('wifi_ssid').value = data.wifi_ssid || '';
              document.getElementById('wifi_pass').value = data.wifi_password || '';
              document.getElementById('ap_ssid').value = data.ap_ssid || '';
              document.getElementById('ap_pass').value = data.ap_password || '';
              updateFieldsVisibility();
            });
  });

  document.getElementById('wifiForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const modeValue = toggle.checked ? 'ap' : 'wifi';
    const params = new URLSearchParams();

    params.append('mode', modeValue);
    params.append('wifi_ssid', document.getElementById('wifi_ssid').value);
    params.append('wifi_pass', document.getElementById('wifi_pass').value);
    params.append('ap_ssid', document.getElementById('ap_ssid').value);
    params.append('ap_pass', document.getElementById('ap_pass').value);

    fetch('/network/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    }).then(res => {
      if (res.ok) {
        document.getElementById('statusBox').style.display = 'block';
        document.getElementById('wifiForm').style.display = 'none';
      }
    });
  });
</script>
</body>
</html>
