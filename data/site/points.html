<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор точек (Полярные координаты)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eceff1;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin: 0 0 25px;
            color: #263238;
            text-align: center;
        }

        /* Эффект анимации Floating Labels */
        .floating-group {
            position: relative;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .floating-group input {
            width: 100%;
            padding: 18px 12px 6px 12px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .floating-group input:focus {
            border-color: #2196f3;
        }

        .floating-group label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #90a4ae;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.2s ease;
            background: transparent;
        }

        .floating-group input:focus ~ label,
        .floating-group input:not(:placeholder-shown) ~ label {
            top: 10px;
            font-size: 11px;
            font-weight: bold;
            color: #2196f3;
            transform: translateY(0);
        }

        .floating-group input:not(:placeholder-shown):not(:focus) ~ label {
            color: #78909c;
        }

        .hint {
            font-size: 11px;
            color: #78909c;
            margin-top: -15px;
            margin-bottom: 20px;
            padding-left: 2px;
            line-height: 1.4;
        }

        canvas {
            border: 1px solid #cfd8dc;
            background: #fafafa;
            border-radius: 6px;
            display: block;
            margin: 15px auto;
            width: 100%;
            max-width: 400px;
            height: 400px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-gen { background: #4caf50; }
        .btn-gen:hover { background: #43a047; }

        .btn-rand { background: #ff9800; }
        .btn-rand:hover { background: #f57c00; }

        .btn-send { background: #2196f3; width: 100%; }
        .btn-send:hover { background: #1e88e5; }
        .btn-send:disabled { background: #b0bec5; cursor: not-allowed; }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .ok { background: #e8f5e9; color: #2e7d32; }
        .err { background: #ffebee; color: #c62828; }

    </style>
</head>
<body>
<div class="box">
    <h2>Генератор рисунка</h2>

    <div class="floating-group">
        <input type="text" id="formulaInput" placeholder=" " value="Math.sin(2 * a)">
        <label>Формула для Радиуса r(a)</label>
    </div>
    <div class="hint">Переменная угла — <b>a</b>. Математика: <code>Math.sin()</code>, <code>Math.cos()</code>, <code>Math.abs()</code></div>

    <div class="floating-group">
        <input type="number" id="turnsInput" placeholder=" " value="1" min="1" max="50" step="0.1">
        <label>Количество оборотов (витков)</label>
    </div>

    <div class="floating-group">
        <input type="number" id="pointsCountInput" placeholder=" " value="300" min="10" max="2000">
        <label>Количество точек (всего)</label>
    </div>

    <canvas id="previewCanvas" width="800" height="800"></canvas>

    <div class="btn-group">
        <button class="btn-rand" onclick="setRandomFormula()">🎲 Рандом</button>
        <button class="btn-gen" onclick="generateAndDraw()">🔄 Рассчитать</button>
    </div>
    <button class="btn-send" id="sendBtn" onclick="uploadPoints()" disabled>🚀 Загрузить на ESP32</button>

    <div id="statusBox" class="status"></div>
</div>
<script>
    let generatedPoints = [];

    // Рандомайзер формул с автоподбором оптимальных витков и количества точек
    function setRandomFormula() {
        const formulaInput = document.getElementById('formulaInput');
        const turnsInput = document.getElementById('turnsInput');
        const pointsInput = document.getElementById('pointsCountInput');

        const k1 = (Math.floor(Math.random() * 7) + 2); // 2..8
        const k2 = (Math.floor(Math.random() * 5) + 2); // 2..6
        const k3 = (Math.floor(Math.random() * 3) + 1); // 1..3
        const p1 = (Math.random() * 0.4 + 0.2).toFixed(2); // 0.2..0.6
        const p2 = (Math.random() * 0.4 + 0.4).toFixed(2); // 0.4..0.8

        const templates = [
            { f: `Math.sin(${k1} * a)`, t: 1, p: 360 },
            { f: `Math.cos(${k1} * a)`, t: 1, p: 360 },
            { f: `0.02 * a`, t: k1, p: k1 * 60 },
            { f: `Math.sqrt(0.01 * a)`, t: k1 + 4, p: 500 },
            { f: `${p1} + ${p1} * Math.cos(a)`, t: 1, p: 200 },
            { f: `${p2} + ${p1} * Math.sin(${k3} * a)`, t: 1, p: 240 },
            { f: `Math.abs(Math.sin(${k1} * a))`, t: 1, p: 400 },
            { f: `0.3 + 0.5 * Math.abs(Math.cos(${k1} * a))`, t: 1, p: 400 },
            { f: `Math.sin(${k1}/${k2} * a)`, t: k2, p: k2 * 100 },
            { f: `Math.cos(${k1} * a) + ${p1} * Math.sin(${k2} * a)`, t: 1, p: 500 },
            { f: `Math.sin(a) * Math.cos(${k1} * a)`, t: 1, p: 450 },
            { f: `0.2 + 0.6 * Math.pow(Math.abs(Math.sin(${k1} * a)), ${k2})`, t: 1, p: 500 },
            { f: `0.6 + 0.2 * Math.sin(${k1} * a) * Math.cos(${k1} * a)`, t: 1, p: 360 }
        ];

        const choice = templates[Math.floor(Math.random() * templates.length)];

        formulaInput.value = choice.f;
        turnsInput.value = choice.t;
        pointsInput.value = choice.p;

        // Триггерим события input для корректного срабатывания Floating Labels
        formulaInput.dispatchEvent(new Event('input'));
        turnsInput.dispatchEvent(new Event('input'));
        pointsInput.dispatchEvent(new Event('input'));

        generateAndDraw();
    }

    // Отрисовка графика: соединение сплошными линиями + мелкие точки поверх
    function generateAndDraw() {
        const formulaText = document.getElementById('formulaInput').value;
        const turns = parseFloat(document.getElementById('turnsInput').value) || 1;
        const count = parseInt(document.getElementById('pointsCountInput').value) || 100;
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const statusBox = document.getElementById('statusBox');

        statusBox.style.display = 'none';
        generatedPoints = [];

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const maxRadius = Math.min(cx, cy) - 40;

        // Отрисовка фоновой полярной координатной сетки
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, maxRadius, 0, 2 * Math.PI);
        ctx.moveTo(cx - maxRadius, cy); ctx.lineTo(cx + maxRadius, cy);
        ctx.moveTo(cx, cy - maxRadius); ctx.lineTo(cx, cy + maxRadius);
        ctx.stroke();

        try {
            const formulaFunc = new Function('a', `return ${formulaText};`);
            const maxAngle = turns * 2 * Math.PI;
            const renderPath = [];

            for (let i = 0; i < count; i++) {
                const a = (i / (count - 1)) * maxAngle;
                let r = formulaFunc(a);

                if (isNaN(r)) r = 0;
                generatedPoints.push({ a: a, r: r });

                const drawX = cx + (r * maxRadius) * Math.cos(a);
                const drawY = cy + (r * maxRadius) * Math.sin(a);
                renderPath.push({ x: drawX, y: drawY });
            }

            // 1. Отрисовка непрерывного сплайна (линии)
            ctx.strokeStyle = '#2196f3';
            ctx.lineWidth = 4;
            ctx.beginPath();
            if (renderPath.length > 0) {
                ctx.moveTo(renderPath[0].x, renderPath[0].y);
                for (let i = 1; i < renderPath.length; i++) {
                    ctx.lineTo(renderPath[i].x, renderPath[i].y);
                }
            }
            ctx.stroke();

            // 2. Отрисовка пикселей-маркеров (радиус 2px)
            ctx.fillStyle = '#ff5722';
            renderPath.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 2, 0, 2 * Math.PI);
                ctx.fill();
            });

            document.getElementById('sendBtn').disabled = false;
        } catch (err) {
            statusBox.className = "status err";
            statusBox.innerHTML = "Ошибка в формуле: " + err.message;
            statusBox.style.display = 'block';
            document.getElementById('sendBtn').disabled = true;
        }
    }

    // Побайтовое сохранение ArrayBuffer во float32 и отправка по сети
    function uploadPoints() {
        if (generatedPoints.length === 0) return;

        const statusBox = document.getElementById('statusBox');
        statusBox.className = "status";
        statusBox.style.display = 'block';
        statusBox.innerHTML = "Отправка на ESP32...";

        const binaryData = new Float32Array(generatedPoints.map((({a,r})=>[a,r])).flat());
        const body = binaryData.buffer;
        const headers = {'Content-Type': 'application/octet-stream' }
        const method = "POST"
        fetch('/upload', {method, body, headers})
            .then(res => res.text())
            .then(result => {
                console.log(result)
            });
    }

    // Первичный автоматический запуск расчёта при открытии страницы
    window.addEventListener('DOMContentLoaded', generateAndDraw);

</script>
</body>
</html>
